name: Relevé des jets privés

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - releve.py
      - .github/workflows/releve.yml

permissions:
  contents: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Relevé chez adsb.lol
        run: python3 releve.py

      - name: Ranger le relevé
        run: |
          git config user.name "ArcheVeille robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees/
          if git diff --cached --quiet; then
            echo "Rien de neuf."
            exit 0
          fi
          git commit -m "robot · relevé"
          git push || (git pull --rebase && git push)
